name: Deploy to Hostinger

# Runs on every push to main, and can also be triggered by hand from the
# Actions tab (Run workflow) if you ever need to force a re-upload.
on:
  push:
    branches: [main]
  workflow_dispatch:

# If you push twice in quick succession, let the newer run win instead of
# having two uploads fight over the same files.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload to public_html
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # SCP over SSH. Encrypted end to end, and authenticated with a key
      # rather than a password. Hostinger runs SSH on port 65002, not 22.
      - name: Copy files over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          # Only the files the site actually needs. README.md, .git and
          # .github are simply left out rather than excluded after the fact.
          source: "index.html,properties.html,about.html,assets"
          # This account hosts many domains; each site lives under
          # ~/domains/<domain>/public_html. A bare "public_html" does not
          # exist in the home directory, so the full path is required.
          target: "domains/teal-worm-936223.hostingersite.com/public_html"
          overwrite: true
